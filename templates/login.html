<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#f4f5f7; font-family:'Inter',sans-serif; color:#1a1a2e; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-wrap { width:100%; max-width:400px; padding:24px; }
    .logo-area { text-align:center; margin-bottom:28px; }
    .logo-area img { height:40px; margin:0 auto 12px; display:block; }
    .app-name { font-size:11px; letter-spacing:.2em; color:#aaa; text-transform:uppercase; font-weight:600; }
    .card { background:#fff; border:1px solid #e2e4e9; border-radius:8px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .card-header { background:#f8f9fa; border-bottom:1px solid #e2e4e9; padding:14px 20px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#888; font-weight:600; }
    .card-body { padding:24px 20px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; color:#888; margin-bottom:6px; font-weight:500; }
    .field input {
      width:100%; background:#f8f9fa; border:1px solid #e2e4e9; border-radius:4px;
      color:#1a1a2e; font-family:'Inter',sans-serif; font-size:15px;
      padding:12px 14px; outline:none; transition:all .15s;
    }
    .field input:focus { border-color:#1d6fc4; background:#fff; box-shadow:0 0 0 3px rgba(29,111,196,.1); }
    .shift-block { display:none; margin-bottom:16px; }
    .shift-block.visible { display:block; }
    .shift-label { font-size:11px; color:#888; margin-bottom:8px; font-weight:500; }
    .shift-btns { display:flex; gap:8px; }
    .shift-btn {
      flex:1; background:#f8f9fa; border:1px solid #e2e4e9; border-radius:4px;
      color:#aaa; font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
      padding:12px; cursor:pointer; transition:all .15s; text-align:center;
    }
    .shift-btn.active { background:#e8f9e8; border-color:#22a06b; color:#22a06b; }
    .btn-login {
      width:100%; background:#1d6fc4; border:none; border-radius:4px;
      color:#fff; font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
      padding:14px; cursor:pointer; transition:background .15s; margin-top:4px;
    }
    .btn-login:hover { background:#2580d8; }
    .divider { border:none; border-top:1px solid #e8eaed; margin:18px 0; }
    .btn-guest {
      width:100%; background:#f8f9fa; border:1px solid #e2e4e9; border-radius:4px;
      color:#888; font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
      padding:12px; cursor:pointer; transition:all .15s;
    }
    .btn-guest:hover { background:#e2e4e9; }
    .error-msg { background:#fef0ee; border:1px solid #f5c2bc; color:#c0392b; font-size:12px; padding:10px 14px; border-radius:4px; margin-bottom:16px; display:none; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="logo-area">
    <img src="/static/logo.png" alt="" onerror="this.style.display='none'"/>
    <div class="app-name">Система учёта производства</div>
  </div>
  <div class="card">
    <div class="card-header">Вход в систему</div>
    <div class="card-body">
      <div class="error-msg" id="errorMsg"></div>
      <div class="field">
        <label>Логин</label>
        <input type="text" id="username" placeholder="Введите логин" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль"/>
      </div>
      <div class="shift-block" id="shiftBlock">
        <div class="shift-label">Смена</div>
        <div class="shift-btns">
          <div class="shift-btn" id="shiftA" onclick="selectShift('A')">Смена А</div>
          <div class="shift-btn" id="shiftB" onclick="selectShift('B')">Смена Б</div>
        </div>
      </div>
      <button class="btn-login" onclick="doLogin()">Войти</button>
      <hr class="divider"/>
      <button class="btn-guest" onclick="doGuest()">Войти как гость</button>
    </div>
  </div>
</div>
<script>
  let selectedShift = null;
  document.getElementById('username').addEventListener('input', function() {
    const val = this.value.toLowerCase();
    const block = document.getElementById('shiftBlock');
    if (val.includes('покраска') || val.includes('paint')) {
      block.classList.add('visible');
    } else {
      block.classList.remove('visible');
      selectedShift = null;
      document.querySelectorAll('.shift-btn').forEach(b => b.classList.remove('active'));
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  function selectShift(s) {
    selectedShift = s;
    document.getElementById('shiftA').classList.toggle('active', s === 'A');
    document.getElementById('shiftB').classList.toggle('active', s === 'B');
  }
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.style.display = 'block';
  }
  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showError('Заполните все поля'); return; }
    fetch('/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'password', username, password, shift: selectedShift })
    }).then(r => r.json()).then(d => {
      if (d.ok) window.location.href = d.redirect;
      else showError(d.error || 'Ошибка входа');
    }).catch(() => showError('Ошибка сети'));
  }
  function doGuest() {
    fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mode:'guest' }) })
      .then(r => r.json()).then(d => { if (d.ok) window.location.href = d.redirect; });
  }
</script>
</body>
</html>
