<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Склад</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#f4f5f7; font-family:'Inter',sans-serif; color:#1a1a2e; min-height:100vh; }
    .pm-app { max-width:900px; margin:0 auto; }
    .pm-topbar { background:#fff; padding:0 20px; height:52px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e2e4e9; position:sticky; top:0; z-index:100; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .pm-logo-area { display:flex; align-items:center; gap:12px; }
    .pm-logo { height:32px; display:block; }
    .pm-divider { width:1px; height:22px; background:#e2e4e9; }
    .pm-title { font-size:11px; letter-spacing:.15em; color:#888; text-transform:uppercase; font-weight:600; }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .user-info { font-size:12px; color:#888; }
    .btn-logout { font-size:11px; color:#666; background:#f4f5f7; border:1px solid #e2e4e9; border-radius:4px; padding:6px 14px; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-logout:hover { background:#e2e4e9; }
    .content { padding:20px; }
    .panel { background:#fff; border:1px solid #e2e4e9; border-radius:8px; padding:48px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .panel-title { font-size:13px; font-weight:600; color:#087c8f; letter-spacing:.15em; text-transform:uppercase; }
    .panel-sub { font-size:12px; color:#999; margin-top:10px; line-height:1.5; }
  </style>
</head>
<body>
<div class="pm-app">
  <div class="pm-topbar">
    <div class="pm-logo-area">
      <img class="pm-logo" src="/static/logo.png" alt="" onerror="this.style.display='none'"/>
      <div class="pm-divider"></div>
      <div class="pm-title">Склад</div>
    </div>
    <div class="topbar-right">
      <span class="user-info">{{ user.username }}</span>
      <a href="/logout"><button class="btn-logout">Выйти</button></a>
    </div>
  </div>

  <div class="content">
    <div class="panel">
      <div class="panel-title">Склад</div>
      <div class="panel-sub">Лендинг кладовщика готов. Очередь перемещений и уведомления будут добавлены следующим этапом.</div>
    </div>
  </div>
</div>
</body>
</html>
